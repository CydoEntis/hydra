# Builds hydra for every platform when a version tag (v1.2.3) is pushed, and attaches the
# archives and their checksums to a GitHub Release. The install scripts download from it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-14, target: x86_64-apple-darwin, archive: tar.gz }
          # Static (musl) builds run on any Linux: Ubuntu, Fedora, Arch / Omarchy, Alpine.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, archive: tar.gz, cross: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name=hydra-${{ matrix.target }}
          mkdir -p dist/$name
          cp README.md LICENSE dist/$name/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/hydra.exe dist/$name/
            (cd dist && 7z a -tzip $name.zip $name >/dev/null)
          else
            cp target/${{ matrix.target }}/release/hydra dist/$name/
            (cd dist && tar -czf $name.tar.gz $name)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-${{ matrix.target }}
          path: dist/hydra-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum hydra-* > sha256sums.txt && cat sha256sums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "hydra $TAG" --generate-notes -R "$GITHUB_REPOSITORY"
          fi

  # Install the release just published, the way users do, and run it.
  verify:
    needs: release
    name: install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      HYDRA_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    # The installers as users get them: from main, through the GitHub CLI.
    steps:
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/install.sh" | sh
          ~/.local/bin/hydra --version
          ~/.local/bin/hydra doctor || true
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$env:GITHUB_REPOSITORY/contents/install.ps1" | Out-String | iex
          & "$env:LOCALAPPDATA\Programs\hydra\hydra.exe" --version
